<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gruha — See it in your room</title>
<!--
  This used to be a four-product Décor Kart demo. It is now a redirect to /decorkart/, because:
   - it carried hard-coded prices that had gone stale upstream (a console shown at Rs.28,600 that
     Décor Kart now sells for Rs.24,310), and a demo with wrong prices is worse than no demo;
   - /decorkart/ is the URL that goes in the outreach email, and anyone who strips the path off it
     should land in the demo rather than on a second, older copy of it.
  GitHub Pages serves static files only, so this is a meta refresh plus a real link for anyone whose
  browser blocks it. The widget itself is unaffected: it is served from /v13/embed.js.
-->
<meta http-equiv="refresh" content="0; url=/decorkart/">
<link rel="canonical" href="https://room.gruhalabs.com/decorkart/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f2;color:#241f1b;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
  a{color:#b08642;font-weight:700}
  p{color:#8a827a}
</style>
</head>
<body>
  <div>
    <h1>See it in your room</h1>
    <p>Taking you to the demo storefront…</p>
    <p><a href="/decorkart/">Open the Décor Kart demo</a></p>
  </div>
  <script>location.replace('/decorkart/')</script>
</body>
</html>
