<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gruha — Usage dashboard</title>
<style>
  :root{--ink:#241f1b;--muted:#7a736b;--line:#e9e4dc;--bg:#faf7f2;--ok:#1f7a4d;--bad:#b4231b;--gold:#b08642}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:34px 22px 80px}
  h1{font-size:23px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .v{font-size:25px;font-weight:800;margin-top:5px}
  .v small{font-size:13px;color:var(--muted);font-weight:600}
  .bar{height:9px;background:#eee8e0;border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--gold)}
  h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:30px 0 10px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .chart{display:flex;align-items:flex-end;gap:5px;height:140px}
  .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0}
  .chart .d{background:#2c3b38;border-radius:3px 3px 0 0}
  .chart .f{background:#e0b4b0;border-radius:3px 3px 0 0}
  .chart .lbl{font-size:9px;color:var(--muted);text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden}
  .prod{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
  .prod .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prod .pb{width:46%;height:8px;background:#eee8e0;border-radius:99px;overflow:hidden}
  .prod .pb i{display:block;height:100%;background:#2c3b38}
  .prod .c{width:28px;text-align:right;font-weight:700;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .r{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .r img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f1ece4}
  .r .ph{width:100%;aspect-ratio:4/3;background:#f1ece4;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px}
  .r .m{padding:8px 10px;font-size:12px}
  .r .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r .m span{color:var(--muted)}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-top:3px}
  .pill.ok{background:#e6f3ec;color:var(--ok)}
  .pill.bad{background:#fdeceb;color:var(--bad)}
  .btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:9px 15px;border-radius:9px}
  .err{background:#fdeceb;color:var(--bad);padding:14px 16px;border-radius:12px;font-size:14px}
  .muted{color:var(--muted);font-size:13px}
  .sample{background:#fff4dc;color:#7a5a12;border:1px solid #f0dca8;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;margin:0 0 18px}
  .fun{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media(max-width:760px){.fun{grid-template-columns:repeat(2,1fr)}}
  .fun .card .v{font-size:22px}
  table.ft{width:100%;border-collapse:collapse;font-size:13px}
  table.ft th{text-align:right;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.ft th:first-child,table.ft td:first-child{text-align:left}
  table.ft td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
</style></head><body><div class="wrap" id="app">
  <p class="muted">Loading…</p>
</div>
<script>
(function () {
  var API = 'https://txkxblempgconaeplqde.supabase.co/functions/v1/embed-dashboard'
  var token = new URLSearchParams(location.search).get('token')
  var app = document.getElementById('app')
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c] }) }
  // 17 Nov 2026 — proof report: opened -> chose a photo -> saw it in their room -> tapped Buy.
  var inr = function (n) { return '₹' + Math.round(n || 0).toLocaleString('en-IN') }
  function ordersHtml (o) {
    var head = '<h2>Orders from shoppers who saw it in their room</h2>'
    if (!o) return head + '<div class="panel"><p class="muted">Order tracking shows here once it is switched on in the Gruha Shopify app (Settings → Order tracking).</p></div>'
    var c = function (k, v, sub) { return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v +
      (sub ? ' <small>' + sub + '</small>' : '') + '</div></div>' }
    return head + '<div class="cards">' +
      c('Orders after seeing it', o.seen_orders, o.seen_share_pct != null ? o.seen_share_pct + '% of all orders' : '') +
      c('Revenue from those orders', inr(o.seen_revenue)) +
      c('Bought the product they saw', o.matched_orders) +
      c('All store orders', o.total_orders, inr(o.total_revenue)) + '</div>' +
      '<p class="muted" style="margin-top:8px">' + esc(o.note || '') + '</p>'
  }
  function funnelHtml (f) {
    if (!f) return ''
    var c = function (k, v, sub) { return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v +
      (sub ? ' <small>' + sub + '</small>' : '') + '</div></div>' }
    var rows = (f.by_product || []).map(function (p) {
      return '<tr><td>' + esc(p.name) + '</td><td>' + p.opened + '</td><td>' + p.photos + '</td><td>' + p.rendered +
        '</td><td><b>' + p.buy_clicks + '</b></td><td>' + p.shares + '</td></tr>' }).join('')
    return '<h2>Shopper journey this period</h2><div class="fun">' +
      c('Opened the button', f.opened, f.unique_shoppers ? '· ' + f.unique_shoppers + ' shoppers' : '') +
      c('Chose a photo', f.chose_photo, f.photo_rate_pct != null ? f.photo_rate_pct + '%' : '') +
      c('Saw it in their room', f.saw_in_room) +
      c('Tapped Buy', f.buy_clicks, f.buy_rate_pct != null ? f.buy_rate_pct + '% of renders' : '') +
      c('Shared on WhatsApp', f.shares) + '</div>' +
      (rows ? '<div class="panel" style="margin-top:12px;overflow-x:auto"><table class="ft"><tr><th>Product</th><th>Opened</th>' +
        '<th>Photo</th><th>Saw it</th><th>Buy taps</th><th>Shared</th></tr>' + rows + '</table></div>' : '') +
      '<p class="muted" style="margin-top:8px">' + esc(f.note || '') + (SAMPLE ? '' : ' Opens and photos are counted from 16 Nov 2026.') + '</p>' +
      ordersHtml(f.orders)
  }
  // ?sample=1 — a SAMPLE dashboard for presentations. Illustrative numbers only, clearly labelled;
  // it never calls the API and shows no real brand's data.
  var SAMPLE = new URLSearchParams(location.search).get('sample') === '1'
  if (!token && !SAMPLE) { app.innerHTML = '<div class="err">This link is missing its token.</div>'; return }

  function sampleData () {
    var now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), 1), end = new Date(now.getFullYear(), now.getMonth() + 1, 1)
    // daily renders sum to the 54 shown in the cards; dates built in local time
    var days = [], seq = [1, 3, 2, 4, 2, 5, 3, 1, 4, 6, 2, 3, 5, 2, 4, 3, 4]
    var pad = function (n) { return (n < 10 ? '0' : '') + n }
    for (var i = 0; i < seq.length; i++) {
      var dt = new Date(start.getFullYear(), start.getMonth(), 1 + i)
      days.push({ date: dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()), done: seq[i], failed: (i === 3 || i === 10) ? 1 : 0 })
    }
    // name, opened, chose a photo, saw it, buy taps, shares
    var prods = [
      ['Distressed Floor Mirror', 88, 21, 15, 5, 3], ['Carved White Console', 70, 14, 10, 3, 2],
      ['Blue Pedestal Side Table', 58, 11, 8, 2, 1], ['Chinoiserie Fruit Bowl', 52, 10, 8, 2, 1],
      ['Jute Round Mirror', 41, 8, 6, 1, 1], ['Chevron Planter', 30, 5, 4, 1, 0], ['Woven Storage Basket', 22, 4, 3, 0, 1]]
    var by = prods.map(function (p) { return { name: p[0], opened: p[1], photos: p[2], rendered: p[3], buy_clicks: p[4], shares: p[5] } })
    var sum = function (k) { return by.reduce(function (a, r) { return a + r[k] }, 0) }
    var saw = sum('rendered')
    var imgs = [['g_mirror_after', 'Distressed Floor Mirror'], ['g_console_after', 'Carved White Console'],
      ['g_table_after', 'Blue Pedestal Side Table'], ['g_bowl_after', 'Chinoiserie Fruit Bowl'], ['g_look_after', 'Bedroom look (4 pieces)']]
    return {
      brand: 'Your brand (sample)', period: { start: start.toISOString(), end: end.toISOString() },
      usage: { used: saw, limit: 60, utilisation_pct: Math.round(saw / 60 * 100) },
      totals: { done: saw, failed: 2 },
      daily: days,
      topProducts: by.map(function (r) { return { name: r.name, count: r.rendered } }),
      recent: imgs.map(function (x, i) { return { product: x[1], status: 'done', at: new Date(now.getTime() - i * 5.3e6).toISOString(), thumb: 'media/renders/' + x[0] + '.jpg' } }),
      recentHiddenNoImage: 0,
      funnel: { opened: sum('opened'), unique_shoppers: Math.round(sum('opened') * 0.78), chose_photo: sum('photos'), saw_in_room: saw,
        buy_clicks: sum('buy_clicks'), shares: sum('shares'), photo_rate_pct: Math.round(sum('photos') / sum('opened') * 1000) / 10,
        buy_rate_pct: Math.round(sum('buy_clicks') / saw * 1000) / 10, by_product: by,
        note: 'Buy taps are clicks on your Buy button from a result, not confirmed orders.',
        orders: { total_orders: 162, total_revenue: 2148000, seen_orders: 4, seen_revenue: 71400, matched_orders: 3, currency: 'INR', seen_share_pct: 2.5,
          note: 'Orders are reported by your store\u2019s checkout (Shopify). \u201CSaw it in their room\u201D means the shopper saw a Gruha render before checking out.' } }
    }
  }

  var load = SAMPLE ? Promise.resolve({ ok: true, j: sampleData() })
    : fetch(API + '?token=' + encodeURIComponent(token))
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j } }) })
  load
    .then(function (res) {
      if (!res.ok) throw new Error(res.j.error || 'Could not load this dashboard.')
      var d = res.j, u = d.usage
      var pct = u.utilisation_pct != null ? u.utilisation_pct : (d.credits && d.credits.monthly_utilisation_pct != null ? d.credits.monthly_utilisation_pct : 0)
      var maxDay = Math.max.apply(null, d.daily.map(function (x) { return x.done + x.failed }).concat([1]))
      var maxProd = Math.max.apply(null, d.topProducts.map(function (x) { return x.count }).concat([1]))
      var fmt = function (s) { return s ? new Date(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '—' }

      app.innerHTML =
        (SAMPLE ? '<div class="sample">Sample dashboard · illustrative numbers, not a real brand\u2019s data</div>' : '') +
        '<h1>' + esc(d.brand) + ' — “See it in your room”</h1>' +
        '<p class="sub">Billing period ' + fmt(d.period.start) + ' → ' + fmt(d.period.end) + '</p>' +
        '<div class="cards">' +
          '<div class="card"><div class="k">Renders this period</div><div class="v">' + u.used +
            ' <small>/ ' + u.limit + '</small></div><div class="bar"><i style="width:' + Math.min(pct, 100) + '%"></i></div></div>' +
          '<div class="card"><div class="k">Utilisation</div><div class="v">' + pct + '<small>%</small></div></div>' +
          '<div class="card"><div class="k">Successful</div><div class="v">' + d.totals.done + '</div></div>' +
          '<div class="card"><div class="k">Failed <small>(not billed)</small></div><div class="v">' + d.totals.failed + '</div></div>' +
        '</div>' +
        funnelHtml(d.funnel) +
        '<h2>Daily usage</h2><div class="panel">' + (d.daily.length ?
          '<div class="chart">' + d.daily.map(function (x) {
            var hD = Math.round((x.done / maxDay) * 120), hF = Math.round((x.failed / maxDay) * 120)
            return '<div class="col" title="' + x.date + ': ' + x.done + ' ok, ' + x.failed + ' failed">' +
              '<div class="f" style="height:' + hF + 'px"></div><div class="d" style="height:' + hD + 'px"></div>' +
              '<div class="lbl">' + x.date.slice(8) + '</div></div>' }).join('') + '</div>'
          : '<p class="muted">No renders yet this period.</p>') + '</div>' +
        '<h2>Top products</h2><div class="panel">' + (d.topProducts.length ?
          d.topProducts.map(function (p) {
            return '<div class="prod"><div class="n">' + esc(p.name) + '</div>' +
              '<div class="pb"><i style="width:' + Math.round((p.count / maxProd) * 100) + '%"></i></div>' +
              '<div class="c">' + p.count + '</div></div>' }).join('')
          : '<p class="muted">No successful renders yet.</p>') + '</div>' +
        '<h2>Recent renders</h2>' +
        (d.recentHiddenNoImage ? '<p class="muted" style="margin:-4px 0 10px">' + d.recentHiddenNoImage +
          ' earlier render(s) pre-date image archiving, so they have no preview. They are still counted above and in the CSV.</p>' : '') +
        '<div class="grid">' + (d.recent.length ? d.recent.map(function (r) {
            return '<div class="r">' + (r.thumb ? '<img src="' + esc(r.thumb) + '" alt="">'
                : '<div class="ph">no image stored</div>') +
              '<div class="m"><b>' + esc(r.product || '—') + '</b>' +
              '<span>' + new Date(r.at).toLocaleString() + '</span><br>' +
              (r.status === 'done' ? '<span class="pill ok">rendered</span>'
                : '<span class="pill bad">failed · not billed</span>') +
              '</div></div>' }).join('') : '<p class="muted">Nothing yet.</p>') + '</div>' +
        '<h2>Export</h2><div class="panel"><a class="btn" href="' + (SAMPLE ? '#' : API + '?format=csv&token=' +
          encodeURIComponent(token)) + '">Download CSV</a> ' +
          '<span class="muted" style="margin-left:10px">This period’s renders.</span></div>'
    })
    .catch(function (e) { app.innerHTML = '<div class="err">' + esc(e.message) + '</div>' })
})()
</script></body></html>
